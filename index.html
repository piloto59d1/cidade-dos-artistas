<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Regras — Cidade dos Artistas</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Documentação oficial de regras da Cidade dos Artistas RP">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #ffc800;
      --theme-color-dark: #d99a06;
      --gold: #ffc800;
      --gold-soft: #ffe27a;
      --gold-deep: #b8860b;
      --bg: #0c0c0c;
      --sidebar-bg: #101010;
      --sidebar-text: #d9d9d9;
      --text: #e8e8e8;
      --border: #262626;
    }

    /* ===== Fundo escuro ===== */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 0;
    }
    .sidebar .app-name {
      text-align: center;
      padding: 22px 16px 10px;
      margin: 0;
    }
    .sidebar .app-name a {
      color: var(--gold);
      font-size: 1.25em;
      font-weight: 800;
      letter-spacing: .5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .sidebar .app-name a:hover { opacity: .9; }
    .sidebar .app-name img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      box-shadow: 0 0 22px rgba(255,200,0,.35);
    }
    .sidebar-toggle { background: var(--gold) !important; }

    /* Busca */
    .sidebar .search { border-bottom: 1px solid var(--border); margin: 0; padding: 12px; }
    .sidebar .search .input-wrap { background: #1a1a1a; border: 1px solid #2e2e2e; border-radius: 8px; }
    .sidebar .search input { color: var(--text); background: transparent; }
    .sidebar .search input::placeholder { color: #777; }

    /* Links do menu */
    .sidebar-nav li a {
      color: var(--sidebar-text);
      font-size: .95em;
      border-right: 2px solid transparent;
      transition: all .15s;
    }
    .sidebar-nav li a:hover { color: var(--gold); background: #191919; }
    .sidebar-nav li.active > a {
      color: var(--gold);
      font-weight: 700;
      border-right: 3px solid var(--gold);
      background: #171300;
    }
    .sidebar-nav li.section-title > a {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: .6px;
      margin-top: 14px;
      font-size: .82em;
      text-transform: uppercase;
    }
    .sidebar-nav ul li a { padding: 6px 16px 6px 24px; }
    .sidebar-nav ul ul li a { padding-left: 42px; font-size: .9em; color: #b8b8b8; }

    /* ===== Conteúdo ===== */
    .markdown-section {
      max-width: 900px;
      padding: 40px 40px 80px;
      color: var(--text);
    }
    .markdown-section a { color: var(--gold); font-weight: 600; }
    .markdown-section a:hover { color: var(--gold-soft); }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #fff;
      font-weight: 800;
      border-bottom: 1px solid var(--border);
      padding-bottom: .3em;
    }
    .markdown-section h1 {
      border-bottom: 3px solid var(--gold);
      display: inline-block;
    }
    .markdown-section strong { color: var(--gold-soft); }
    .markdown-section hr { border-color: var(--border); }
    .markdown-section blockquote {
      background: #161616;
      border-left: 4px solid var(--gold);
      color: #cfcfcf;
    }

    /* ===== Tabelas ===== */
    .markdown-section table { display: table; width: 100%; background: #141414; border-radius: 10px; overflow: hidden; }
    .markdown-section tr:nth-child(2n) { background: #1b1b1b; }
    .markdown-section th {
      background: linear-gradient(180deg, var(--gold), var(--gold-deep));
      color: #1a1400;
      border: none;
      font-weight: 800;
    }
    .markdown-section td { border-top: 1px solid var(--border); color: var(--text); }

    /* ===== Hints (estilo GitBook) ===== */
    .gb-hint {
      border-radius: 10px;
      padding: 14px 18px;
      margin: 16px 0;
      border-left: 4px solid;
      font-size: .95em;
      line-height: 1.6;
    }
    .gb-hint > p:first-child { margin-top: 0; }
    .gb-hint > p:last-child { margin-bottom: 0; }
    .gb-hint ul { margin: 8px 0 0; padding-left: 20px; }
    .gb-hint.info    { background: #101a2a; border-color: #3b82f6; color: #cfe1ff; }
    .gb-hint.warning { background: #241c00; border-color: var(--gold); color: #ffe9a8; }
    .gb-hint.danger  { background: #240b0b; border-color: #ef4444; color: #ffc9c9; }
    .gb-hint.success { background: #07210f; border-color: #10b981; color: #b7f3d3; }

    /* ===== Stepper (estilo GitBook) ===== */
    .gb-stepper { margin: 18px 0; counter-reset: gbstep; }
    .gb-step {
      position: relative;
      padding: 6px 0 22px 44px;
      border-left: 2px solid #2e2e2e;
      margin-left: 15px;
    }
    .gb-step:last-child { border-left-color: transparent; padding-bottom: 4px; }
    .gb-step::before {
      content: counter(gbstep);
      counter-increment: gbstep;
      position: absolute;
      left: -16px; top: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--gold), var(--gold-deep));
      color: #1a1400;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .85em;
      box-shadow: 0 0 12px rgba(255,200,0,.35);
    }
    .gb-step h2, .gb-step h3 { border-bottom: none !important; }

    /* ===== Rodapé ===== */
    .docsify-pagination-container { border-top: 1px solid var(--border); }
    .pagination-item-link { border-color: var(--border) !important; color: var(--text); }
    .pagination-item-title { color: var(--gold) !important; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-deep); }
  </style>
</head>
<body>
  <div id="app">Carregando regras...</div>
  <script>
    window.$docsify = {
      name: '<img src="logo.svg" alt="Cidade dos Artistas">Cidade dos Artistas',
      repo: '',
      coverpage: false,
      onlyCover: false,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      nameLink: '#/',
      search: { placeholder: '🔍 Buscar regras...', noData: 'Nada encontrado', depth: 4 },
      pagination: { previousText: '← Anterior', nextText: 'Próximo →', crossChapter: true, crossChapterText: true }
    };

    // ===== Plugin: sintaxe GitBook (hint / stepper) =====
    window.$docsify.plugins = [
      function (hook, vm) {
        hook.beforeEach(function (content) {
          content = content.replace(
            /\{%\s*hint\s+style="([\w-]+)"\s*(?:icon="[^"]*")?\s*%\}/g,
            '\n<div class="gb-hint $1">\n'
          );
          content = content.replace(/\{%\s*endhint\s*%\}/g, '\n</div>\n');
          content = content.replace(/\{%\s*stepper\s*%\}/g, '\n<div class="gb-stepper">\n');
          content = content.replace(/\{%\s*endstepper\s*%\}/g, '\n</div>\n');
          content = content.replace(/\{%\s*step\s*%\}/g, '\n<div class="gb-step">\n');
          content = content.replace(/\{%\s*endstep\s*%\}/g, '\n</div>\n');
          content = content.replace(/\{%\s*embed\s+[^%]*%\}/g, '');
          return content;
        });
      }
    ].concat(window.$docsify.plugins || []);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/pagination.min.js"></script>
</body>
</html>
